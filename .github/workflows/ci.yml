# CI: Pipeline (ruff + pytest) und Karte (Unit-Tests ohne Browser, Playwright gegen die
# statische Seite). Kein Job braucht Netzdaten: die Pipeline-Tests laufen an tests/fixtures,
# die Browser-Tests an den eingecheckten Kartendaten; MapLibre kommt in den Tests aus
# node_modules, die Hintergrundkarte ist ein leerer Stil.
#
# Ausgeliefert wird per „Deploy from branch“ (Pages liefert main aus, kein Build) – darum
# gehören Änderungen über Pull Requests nach main, dort laufen diese Tests vorher.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  pipeline:
    name: Pipeline (ruff + pytest)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: pipeline
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.1.0
        with:
          enable-cache: true
          cache-dependency-glob: pipeline/uv.lock
      - run: uv sync --locked
      - run: uv run ruff check
      - run: uv run ruff format --check
      - run: uv run pytest

  karte:
    name: Karte (Unit + Playwright)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:unit
      - run: npx playwright install --with-deps chromium
      - run: npm run test:web
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() && failure() }}
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
