# VORÜBERGEHEND (vor dem PR wieder entfernen): lädt die Quellen aus Issue #5 (Hessen: Butzbach,
# Weiterstadt, Ordnungsbehördenbezirk Habichtswald u. a.) und legt Seiten, Linklisten und
# Dateien auf den Branch `dev/erkunden` (orphan), damit sie ohne Netz angesehen werden können.
name: Quellen erkunden (vorübergehend)

on:
  push:
    branches: ["hessen"]
    paths: [".github/workflows/erkunden.yml"]

permissions:
  contents: write

jobs:
  erkunden:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
      - name: Seiten und Dateien laden
        shell: python
        run: |
          import html, json, re, time, urllib.parse, urllib.request
          from html.parser import HTMLParser
          from pathlib import Path

          aus = Path("erkunden"); aus.mkdir()
          T0 = time.monotonic()
          UA = {"User-Agent": "vizsim-geschwindigkeitskontrollen (+https://github.com/vizsim-lab/geschwindigkeitskontrollen)"}
          log = []

          class Links(HTMLParser):
              def __init__(self, basis):
                  super().__init__(convert_charrefs=True)
                  self.basis, self.links, self._a, self._t = basis, [], None, []
              def handle_starttag(self, tag, attrs):
                  if tag == "a" and dict(attrs).get("href"):
                      self._a, self._t = urllib.parse.urljoin(self.basis, dict(attrs)["href"].strip()), []
              def handle_data(self, data):
                  if self._a is not None:
                      self._t.append(data)
              def handle_endtag(self, tag):
                  if tag == "a" and self._a is not None:
                      self.links.append([self._a, " ".join("".join(self._t).split())])
                      self._a = None

          def hole(url, max_bytes=25_000_000, pause=0.7):
              time.sleep(pause)
              start = time.monotonic()
              try:
                  r = urllib.request.urlopen(urllib.request.Request(url, headers=UA), timeout=30)
                  teile, n = [], 0
                  while n < max_bytes and time.monotonic() - start < 120:
                      b = r.read(1 << 16)
                      if not b:
                          break
                      teile.append(b)
                      n += len(b)
                  daten = b"".join(teile)
                  z = f"{r.status} {r.headers.get('content-type')} {len(daten)} {time.monotonic() - start:.1f}s {url}"
                  log.append(z)
                  print(z, flush=True)
                  return daten, r.headers.get("content-type") or "", r.geturl()
              except Exception as e:
                  log.append(f"FEHLER {url}: {e}")
                  print(f"FEHLER {url}: {e}", flush=True)
                  return None, "", url

          def slug(url, endung=""):
              s = re.sub(r"[^A-Za-z0-9._-]+", "_", urllib.parse.unquote(url.split("://", 1)[-1]))
              return s[-140:] + endung

          def seite(ordner, url):
              daten, typ, end = hole(url)
              if daten is None:
                  return None
              endung = "" if re.search(r"\.(json|pdf|html?)$", urllib.parse.urlparse(url).path) else ".html"
              (ordner / slug(url, endung)).write_bytes(daten)
              if "html" not in typ:
                  return []
              p = Links(end)
              p.feed(daten.decode("utf-8", "replace"))
              return p.links

          AUFGABEN = {
              "butzbach": dict(
                  start=["https://stadt-butzbach.de/themen/geschwindigkeitsmessungen/"],
                  blaettern=r"/themen/geschwindigkeitsmessungen/page/\d+/?$",
                  folge=r"stadt-butzbach\.de/(?![^?#]*attachment)[^?#]*geschwindigkeitsmessung[^?#]*/$",
                  dateien=r"(?i)stadt-butzbach\.de/wp-content/uploads/.*\.(pdf|docx?|xlsx?)(\?|$)",
                  laden=r"(?i)messung|geschwind|radar|verkehrs",
                  api=[
                      "https://stadt-butzbach.de/wp-json/wp/v2/media?search=messung&per_page=100",
                      "https://stadt-butzbach.de/wp-json/wp/v2/media?search=sb_oa&per_page=100",
                      "https://stadt-butzbach.de/wp-json/wp/v2/posts?search=Geschwindigkeitsmessungen&per_page=100",
                  ],
                  max=120,
              ),
              "weiterstadt": dict(
                  start=["https://www.weiterstadt.de/wirtschaft-umwelt-verkehr/umwelt-verkehr/geschwindigkeitsmessungen/index.php"],
                  dateien=r"(?i)\.pdf(\?|$)",
                  laden=r"(?i)statistik|messung|geschwind",
              ),
              "naumburg": dict(
                  start=["https://www.naumburg.eu/stadt-buergerservice/service/nachrichtenarchiv/2023-1-quartal-bis-4-quartal/geschwindigkeitsmessung-in-naumburg/"],
                  folge_text=r"(?i)ordnungsbeh",
                  dateien=r"(?i)geschwindigkeitsmessung.*\.pdf(\?|$)",
              ),
              "gudensberg": dict(
                  start=["https://www.gudensberg.de/rathaus-und-buergerservice/aktuelles/neuigkeiten/2024/oktober/geschwindigkeitsmessung/"],
                  dateien=r"(?i)\.pdf(\?|$)",
                  laden=r"(?i)messung|geschwind",
              ),
              "habichtswald": dict(
                  start=["https://www.habichtswald.de/pressemitteilungen/2026/geschwindigkeitsmessungen-horstweg/"],
                  folge_text=r"(?i)^ordnungsbeh",
              ),
              "biebertal": dict(
                  start=["https://www.biebertal.de/infos-tipps/weitere-tipps-infos/geschwindigkeitsmessungen/geschwindigkeitsmessungen.html"],
                  folge_text=r"(?i)geschwindigkeitsmessung|messungen",
                  dateien=r"(?i)\.(pdf|xlsx?)(\?|$)",
                  laden=r"(?i)messung|geschwind|radar",
                  max=6,
              ),
              "koenigstein": dict(start=["https://www.koenigstein.de/rathaus-politik/sicherheit-ordnung/geschwindigkeitsmessungen/"], dateien=r"(?i)messung.*\.pdf(\?|$)"),
              "rodenbach": dict(
                  start=["https://www.rodenbach.de/Rodenbach/Aktuell-informiert/Aktuelles/-Geschwindigkeitsmessung-aktuelle-Informationen-jetzt-auch-auf-der-Homepage-der-Gemeinde-Rodenbach-.php?ModID=255&FID=2161.8061.1"],
                  folge_text=r"(?i)radar",
                  max=6,
              ),
              "niedernhausen": dict(start=["https://www.niedernhausen.de/verwaltung-politik/aktuelles/news/ergebnisse-der-geschwindigkeitsmessungen-zu-schulbeginn/"]),
              "schlitz": dict(start=[
                  "https://www.schlitz.de/nachrichten-startseite/2018/geschwindigkeitsmessungen-in-schlitz/",
                  "https://www.schlitz.de/nachrichten-startseite/2018/geschwindigkeitsmessungen-in-den-stadtteilen/",
                  "https://www.schlitz.de/nachrichten-startseite/2018/geschwindigkeitsmessungen/",
              ]),
              "fragdenstaat": dict(start=[
                  "https://fragdenstaat.de/a/371577",
                  "https://fragdenstaat.de/anfrage/akteneinsicht-geschwindigkeitsmessprotokolle-der-letzten-3-jahre/",
                  "https://fragdenstaat.de/anfrage/veroffentlichung-verkehrsrelevanter-messergebnisse-und-blitzaktionen-der-gemeinde-muhltal/",
              ], dateien=r"media\.frag-den-staat\.de/files/foi/.*\.pdf$"),
          }

          for name, a in AUFGABEN.items():
              ordner = aus / name
              ordner.mkdir()
              for u in a.get("api", []):
                  daten, typ, _ = hole(u)
                  if daten is not None:
                      (ordner / slug(u, ".json")).write_bytes(daten)
              warte, gesehen, dateien, alle_links = list(a["start"]), set(), {}, {}
              while warte and len(gesehen) < a.get("max", 20) and time.monotonic() - T0 < 18 * 60:
                  url = warte.pop(0)
                  if url in gesehen:
                      continue
                  gesehen.add(url)
                  links = seite(ordner, url)
                  if links is None:
                      continue
                  alle_links[url] = links
                  for href, text in links:
                      h = href.split("#")[0]
                      if not h.startswith("http") or h in gesehen:
                          continue
                      if a.get("dateien") and re.search(a["dateien"], h):
                          dateien.setdefault(h, text)
                      elif (a.get("blaettern") and re.search(a["blaettern"], h)) or (
                          a.get("folge") and re.search(a["folge"], h)
                      ) or (a.get("folge_text") and text and re.search(a["folge_text"], text)):
                          warte.append(h)
              (ordner / "links.json").write_text(json.dumps(alle_links, ensure_ascii=False, indent=1))
              (ordner / "dateien.json").write_text(json.dumps(dateien, ensure_ascii=False, indent=1))
              for u in sorted(dateien):
                  if a.get("laden") and not re.search(a["laden"], u):
                      continue
                  if time.monotonic() - T0 > 22 * 60:
                      log.append(f"ZEIT um, nicht geladen: {u}")
                      continue
                  daten, typ, _ = hole(u)
                  if daten is not None:
                      (ordner / slug(u)).write_bytes(daten)
              (aus / "uebersicht.txt").write_text("\n".join(log) + "\n")
          orte = aus / "nominatim"
          orte.mkdir()
          for g in ["Niedernhausen", "Biebertal", "Königstein im Taunus", "Rodenbach (Main-Kinzig-Kreis)",
                    "Schlitz", "Kirchhain", "Limburg an der Lahn", "Darmstadt", "Kaufungen", "Solms",
                    "Mühltal", "Naumburg (Hessen)", "Gudensberg", "Habichtswald", "Butzbach", "Weiterstadt",
                    "Münzenberg", "Rockenberg", "Wölfersheim", "Erzhausen"]:
              q = urllib.parse.urlencode({"q": f"{g}, Hessen", "format": "jsonv2", "limit": 3,
                                          "featureType": "settlement", "addressdetails": 1})
              daten, typ, _ = hole("https://nominatim.openstreetmap.org/search?" + q, pause=1.2)
              if daten is not None:
                  (orte / (re.sub(r"\W+", "_", g) + ".json")).write_bytes(daten)
          (aus / "uebersicht.txt").write_text("\n".join(log) + "\n")
          print("fertig", len(log), flush=True)
      - name: Auf dev/erkunden legen
        if: always()
        run: |
          du -sh erkunden/*
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch --orphan dev/erkunden
          git add -f erkunden
          git commit -q -m "Quellen erkunden (Lauf ${{ github.run_number }})"
          git push -f origin dev/erkunden
