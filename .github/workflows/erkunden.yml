# VORÜBERGEHEND (vor dem PR wieder entfernen): lädt mögliche Quellen der „grünen“ Städte der
# Datenlage (Konstanz, Schonungen, Oberderdingen, Duisburg, Krefeld, Kreis Unna) und legt sie
# auf den Branch `dev/erkunden` (orphan), damit sie ohne Netz angesehen werden können.
name: Quellen erkunden (vorübergehend)

on:
  push:
    branches: ["gruene-staedte"]
    paths: [".github/workflows/erkunden.yml"]

permissions:
  contents: write

jobs:
  erkunden:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - name: Abfragen und Anhänge laden
        shell: python
        run: |
          import json, re, time, urllib.parse, urllib.request
          from pathlib import Path
          aus = Path("erkunden"); aus.mkdir()
          UA = {"User-Agent": "vizsim-geschwindigkeitskontrollen (+https://github.com/vizsim-lab/geschwindigkeitskontrollen)"}
          log = []
          def hole(url, name, max_bytes=40_000_000):
              try:
                  r = urllib.request.urlopen(urllib.request.Request(url, headers=UA), timeout=90)
                  daten = r.read(max_bytes)
                  (aus / name).write_bytes(daten)
                  log.append(f"{r.status} {r.headers.get('content-type')} {len(daten)} {url} -> {name}")
                  return daten
              except Exception as e:
                  log.append(f"FEHLER {url}: {e}")
                  return b""
          def slug(url):
              return re.sub(r"[^A-Za-z0-9._-]+", "_", urllib.parse.unquote(url.split("://", 1)[-1]))[-120:]
          q = urllib.parse.quote
          for u in [
              "https://media.frag-den-staat.de/files/foi/523145/Beanstandung_geschwaerzt.pdf",
              "https://media.frag-den-staat.de/files/foi/532122/StatistikStandortemobileBlitzer.pdf",
              "https://media.frag-den-staat.de/files/foi/589993/Messprotokolle01.04.2021_geschwaerzt.pdf",
              "https://media.frag-den-staat.de/files/foi/841601/scan.pdf",
              "https://media.frag-den-staat.de/files/foi/842507/messprotokolleholzwickede_geschwaerzt.pdf",
              "https://www.oberderdingen.de/resources/ecics_2348.pdf",
              "https://www.oberderdingen.de/resources/ecics_3163.pdf",
              "https://www.oberderdingen.de/resources/ecics_3658.pdf",
              "https://oberderdingen.de/resources/ecics_4049.pdf",
              "https://www.oberderdingen.de/resources/ecics_4300.pdf",
              "https://www.oberderdingen.de/resources/ecics_4317.pdf",
              "https://www.oberderdingen.de/resources/ecics_4342.pdf",
              "https://schonungen.de/wp-content/uploads/2023/06/Verkehrsstatistik-KVUe-2023-04.docx",
              "https://schonungen.de/wp-content/uploads/2024/07/Verkehrsstatistik-KVUe-2024-06.docx",
          ]:
              hole(u, slug(u))
              time.sleep(0.5)
          (aus / "uebersicht.txt").write_text("\n".join(log) + "\n")
          print("\n".join(log))
      - name: Auf dev/erkunden legen
        run: |
          ls -la erkunden | head -100
          du -sh erkunden
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch --orphan dev/erkunden
          git add -f erkunden
          git commit -q -m "Quellen erkunden (Lauf ${{ github.run_number }})"
          git push -f origin dev/erkunden
