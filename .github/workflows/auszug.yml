# Entwicklungsauszug: lädt, was die Pipeline braucht (OSM Berlin + Regierungsbezirk Köln,
# Berliner PDF-Anlagen, Aachener Monatsdateien, Kölner und Bonner Jahresdateien), liest OSM in
# die kompakten Tabellen von `kontrollen osm` und legt diese samt den Rohdateien auf den Branch
# `dev/auszug` (orphan, wird überschrieben). Große CSV-Dateien liegen dort gzip-komprimiert
# (`gunzip` nach dem Kopieren).
# Wozu: Entwickeln und Testen der Verortung ohne Netzzugang zu Geofabrik/Open-Data-Portalen –
# `git fetch origin dev/auszug` und die Dateien nach pipeline/data/ kopieren.
# Der Branch gehört nicht nach main und kann jederzeit gelöscht werden.
name: Entwicklungsauszug

on:
  workflow_dispatch:
  push:
    branches: ["dev/auszug-anfordern"]

concurrency:
  group: auszug
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  auszug:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    defaults:
      run:
        working-directory: pipeline
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.1.0
        with:
          enable-cache: true
          cache-dependency-glob: pipeline/uv.lock
      - run: uv sync --locked
      - name: Rohdaten laden (Berliner PDF-Anlagen, Kataloge neu, OSM)
        run: |
          mkdir -p data/interim
          uv run kontrollen fetch --osm --neu || echo "fetch mit Fehlern" > data/interim/fetch_fehlgeschlagen.txt
      - name: OSM auslesen
        run: uv run kontrollen osm
      - name: Einlesen (Bericht, darf scheitern)
        run: uv run kontrollen build || echo "build gescheitert" > data/interim/build_fehlgeschlagen.txt
      - name: Zusammenfassung
        run: |
          {
            echo "### Auszug"
            echo '```'
            du -sh data/interim/osm/* data/raw/aachen 2>/dev/null
            ls data/raw/aachen | head -100
            sha256sum data/raw/berlin/* 2>/dev/null
            echo '```'
            echo '```json'
            cat data/interim/build_bericht.json 2>/dev/null || true
            echo '```'
            for stadt in koeln bonn; do
              echo "### $stadt"
              echo '```'
              cat data/interim/fetch_fehlgeschlagen.txt 2>/dev/null || true
              jq -r '"Kataloge: \(.katalog)", (.fehler[]? | "Fehler: \(.)"), (.datensaetze[] | "- \(.titel) [\(.name)] \(.lizenz // "")"), (.dateien[] | "  \(.datei) <- \(.url)")' "config/${stadt}_ressourcen.json" 2>/dev/null || echo "keine Ressourcenliste"
              du -sh data/raw/$stadt/* 2>/dev/null | head -60
              for f in data/raw/$stadt/*.csv; do
                [ -f "$f" ] || continue
                echo "== $f ($(wc -l < "$f") Zeilen)"
                head -c 600 "$f" | head -4
                echo
              done
              echo '```'
            done
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Auf dev/auszug legen
        working-directory: .
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # die Ressourcenlisten sind auf main versioniert -> der Orphan-Branch entfernt sie
          mkdir -p "$RUNNER_TEMP/res"
          cp pipeline/config/*_ressourcen.json "$RUNNER_TEMP/res/" 2>/dev/null || true
          git switch --orphan dev/auszug
          mkdir -p pipeline/config && cp "$RUNNER_TEMP"/res/*_ressourcen.json pipeline/config/ 2>/dev/null || true
          # große CSV-Dateien komprimiert (GitHub nimmt keine Dateien über 100 MB)
          find pipeline/data/raw/koeln pipeline/data/raw/bonn -name '*.csv' -size +1M -exec gzip -9 {} \; 2>/dev/null || true
          git add -f pipeline/data/interim/osm pipeline/data/raw/aachen pipeline/config/*_ressourcen.json
          git add -f pipeline/data/raw/berlin/*.pdf 2>/dev/null || true
          for d in pipeline/data/raw/koeln pipeline/data/raw/bonn; do
            [ -d "$d" ] && git add -f "$d"
          done
          for f in pipeline/data/interim/build_bericht.json pipeline/data/interim/build_fehlgeschlagen.txt pipeline/data/interim/fetch_fehlgeschlagen.txt; do
            [ -f "$f" ] && git add -f "$f"
          done
          git commit -q -m "Entwicklungsauszug (Lauf ${{ github.run_number }})"
          git push -f origin dev/auszug
