# Die EINE Quellenliste des Projekts. Speist `kontrollen fetch|build|osm|site` und
# pipeline/data/karte/manifest.json, aus dem die Karte ihre Quellenangaben und Lizenzhinweise
# baut – nie im Frontend nachtragen.
#
# Pfade: `datei` relativ zu pipeline/data/ (gitignored Rohdaten).

staedte:
  berlin:
    label: "Berlin"
    crs_m: "EPSG:25833"            # metrisch (UTM 33N), Ausgabe immer EPSG:4326
    bbox: [13.08, 52.33, 13.77, 52.68]
    start: { lon: 13.40, lat: 52.51, zoom: 10.6 }
    kontrollen:
      label: "Temporäre Geschwindigkeitskontrollen 2017 bis August 2020"
      bereitsteller: "Polizei Berlin"
      kurz: "Polizei Berlin"
      titel: "Auszug aus der Geschwindigkeitsdatenbank (IFG-Bescheid vom 09.12.2020, Anlagen 1–4)"
      herkunft_url: "https://fragdenstaat.de/anfrage/geschwindigkeitskontrollen-von-kfz-in-berlin/"
      lizenz: null                  # der Bescheid nennt keine Lizenz
      lizenz_hinweis: "Amtliche Auskunft nach IFG, ohne Lizenzangabe"
      # Die Polizei hat je Zeitraum ein PDF geliefert (gedruckte Tabelle, eine Zeile je
      # Kontrolle); `berlin_pdf.py` liest es Zeichen für Zeichen. Gegenprobe: Anlage 3 ergibt
      # alle 9.150 Zeilen von 2019 der früheren CSV (vizsim/geschwindigkeitskontrollen, v01) –
      # bis auf deren Lesefehler („50/30“ als Tempo 0, „-“ als 0, abgeschnittene Zellen).
      anlagen:
        - jahr: 2017
          titel: "Anlage 1 (2017)"
          url: "https://media.frag-den-staat.de/files/foi/546222/202012094IFG102.20Anlage1GeschwindigkeitskontrollenBerlin2017.pdf"
          sha256: "79d01ca129ca4718efa81222cae8022a6535ad347fa0ac3eb3ff2f5f5d558780"
          datei: "raw/berlin/anlage1_2017.pdf"
        - jahr: 2018
          titel: "Anlage 2 (2018)"
          url: "https://media.frag-den-staat.de/files/foi/546222/202012095IFG102.20Anlage2GeschwindigkeitskontrollenBerlin2018.pdf"
          sha256: "0c05f54626e9b62ecbfbdf29012f712c6377371a5419133f8e4c19104eca97d2"
          datei: "raw/berlin/anlage2_2018.pdf"
        - jahr: 2019
          titel: "Anlage 3 (2019)"
          url: "https://media.frag-den-staat.de/files/foi/546222/202012096IFG102.20Anlage3GeschwindigkeitskontrollenBerlin2019.pdf"
          sha256: "93ff55540cd6bd713c6b2d9fbdf6b459b9752870cbb7b074013559bef243829a"
          datei: "raw/berlin/anlage3_2019.pdf"
        - jahr: 2020
          titel: "Anlage 4 (01.01.–31.08.2020, Stand 05.10.2020)"
          url: "https://media.frag-den-staat.de/files/foi/546222/202012097IFG102.20Anlage4GeschwindigkeitskontrollenBerlinbis31.08.2020.pdf"
          sha256: "f8ce5b590f5500bb968afd9269984fa51dce2826f7602457a6e0eeca1342a270"
          datei: "raw/berlin/anlage4_2020.pdf"
    osm:
      label: "Straßennetz und Adressen Berlin (Verortung)"
      url: "https://download.geofabrik.de/europe/germany/berlin-latest.osm.pbf"
      datei: "raw/osm/berlin-latest.osm.pbf"
      # Verwaltungsgrenzen in OSM: 4 = Land Berlin, 9 = Bezirke, 10 = Ortsteile
      gebiete_admin_level: ["4", "9", "10"]
      stadtgrenze: { name: "Berlin", admin_level: ["4"] }
      bezirk_ebene: "9"               # „Verwaltungsbezirk“ der Kontrollen grenzt die Suche ein

  aachen:
    label: "Aachen"
    crs_m: "EPSG:25832"            # metrisch (UTM 32N)
    bbox: [5.97, 50.63, 6.22, 50.86]
    start: { lon: 6.09, lat: 50.77, zoom: 11.6 }
    kontrollen:
      label: "Geschwindigkeitskontrollen der Stadt Aachen"
      bereitsteller: "Stadt Aachen"
      kurz: "Stadt Aachen"
      titel: "Geschwindigkeitskontrollen (Open Data, Monatsdateien)"
      herkunft_url: "https://offenedaten.aachen.de/"
      # CKAN-Kataloge, der Reihe nach probiert. Gefunden werden alle Datensätze, deren Titel
      # zum Muster passt; jede Excel-/CSV-Ressource ist eine Monatsdatei. Was gefunden wurde,
      # schreibt `fetch --aachen --neu` nach config/aachen_ressourcen.json (mit Prüfsummen) –
      # ohne --neu lädt `fetch` genau diese Liste.
      ckan:
        - "https://offenedaten.aachen.de/api/3/action/"
        - "https://ckan.open.nrw.de/api/3/action/"
      suche: "Geschwindigkeitskontrollen"
      titel_muster: "(?i)geschwindigkeitskontroll"
      stadt_muster: "(?i)aachen"
      formate: ["XLSX", "XLS", "CSV"]
      ressourcen: "config/aachen_ressourcen.json"
      ordner: "raw/aachen"
      # Das Portal hält je Jahr nur die letzten drei Monate. Den Juni 2020 der alten Karte gibt
      # es dort nicht mehr – er steckt vollständig in deren HTML (Tooltips), auf einen Commit
      # festgelegt.
      alt:
        label: "Juni 2020 (aus der alten Karte, Datei nicht mehr im Portal)"
        url: "https://raw.githubusercontent.com/vizsim/geschwindigkeitskontrollen/47f921e01ec9aafcf9895c3b696de825a315f577/geschw_aachen_juni2020.html"
        sha256: "5796c29593b8d6af817be57dffbadf2a39373951c12c0829ceb32e980f5d5967"
        datei: "raw/aachen_alt/geschw_aachen_juni2020.html"
    osm:
      label: "Straßennetz und Adressen Aachen (Verortung)"
      # Geofabrik hat keinen Stadt-Auszug; der Regierungsbezirk wird auf `bbox` zugeschnitten
      url: "https://download.geofabrik.de/europe/germany/nordrhein-westfalen/koeln-regbez-latest.osm.pbf"
      datei: "raw/osm/koeln-regbez-latest.osm.pbf"
      # Aachen gehört seit 2009 zur StädteRegion; welche Ebene die Stadt in OSM trägt, ist hier
      # egal: genommen wird die kleinste Fläche namens „Aachen“ auf diesen Ebenen.
      gebiete_admin_level: ["6", "7", "8", "9", "10"]
      stadtgrenze: { name: "Aachen", admin_level: ["6", "7", "8"] }
      bezirk_ebene: null              # die Aachener Daten nennen keinen Bezirk

  koeln:
    label: "Köln"
    crs_m: "EPSG:25832"            # metrisch (UTM 32N)
    bbox: [6.76, 50.82, 7.17, 51.09]
    start: { lon: 6.96, lat: 50.94, zoom: 11.2 }
    kontrollen:
      label: "Geschwindigkeitsüberwachung der Stadt Köln"
      bereitsteller: "Stadt Köln"
      kurz: "Stadt Köln"
      titel: "Geschwindigkeitsüberwachung Köln – Open Data, Einzelverstöße und Standorte"
      herkunft_url: "https://www.offenedaten-koeln.de/"
      hinweis: >-
        Nur die mobile Überwachung der Stadt (Dienststelle S-02; 2017 ohne Dienststelle und
        2018/19 bei S-01 nach dem Standort): die festen Anlagen (S-01, K-04) messen fast jeden Tag
        und bleiben draußen, ebenso Fälle an Kürzeln, die keine Standorttabelle nennt (vor allem
        2017–2019). Die Kontrollen der Polizei fehlen in den Daten; Uhrzeit und Dauer der Messung
        nennt Köln nicht.
      # Jahresdatensätze (2017–2022, 2023, 2024, …): je Verstoß eine Zeile, dazu Tabellen der
      # Standorte je Dienststelle. Das Stadtportal ist ein DKAN 2 (Suche `api/1/search`);
      # GovData spiegelt es (CKAN). open.nrw antwortet GitHub Actions nicht (Stand 11/2026).
      # Beide werden gefragt, die Funde vereinigt (`alle_kataloge`).
      kataloge:
        - { art: dkan, url: "https://www.offenedaten-koeln.de/api/1/" }
        - { art: ckan, url: "https://www.govdata.de/ckan/api/3/action/" }
      alle_kataloge: true
      suche: ["Geschwindigkeitsüberwachung Köln"]
      titel_muster: "(?i)geschwindigkeits(ü|ue)berwachung"
      stadt_muster: "(?i)k(ö|oe)ln"
      formate: ["CSV"]
      ressourcen: "config/koeln_ressourcen.json"
      ordner: "raw/koeln"
    osm:
      label: "Straßennetz und Adressen Köln (Verortung)"
      url: "https://download.geofabrik.de/europe/germany/nordrhein-westfalen/koeln-regbez-latest.osm.pbf"
      datei: "raw/osm/koeln-regbez-latest.osm.pbf"
      # Köln: 6 = kreisfreie Stadt, 9 = Stadtbezirke, 10 = Stadtteile
      gebiete_admin_level: ["6", "9", "10"]
      stadtgrenze: { name: "Köln", admin_level: ["6"] }
      bezirk_ebene: "10"              # „Stadtteil“ der Standorte grenzt die Suche ein

  bonn:
    label: "Bonn"
    crs_m: "EPSG:25832"            # metrisch (UTM 32N)
    bbox: [7.01, 50.62, 7.22, 50.78]
    start: { lon: 7.10, lat: 50.71, zoom: 11.8 }
    kontrollen:
      label: "Geschwindigkeitsverstöße der Bundesstadt Bonn"
      bereitsteller: "Bundesstadt Bonn"
      kurz: "Stadt Bonn"
      titel: "Bußgelder fließender Verkehr – Open Data, Einzelverstöße"
      herkunft_url: "https://opendata.bonn.de/"
      # GovData nennt keine Lizenz; Open.NRW führt die Jahresdateien als „Creative Commons CC
      # Zero License (cc-zero)“, z. B. https://ckan.open.nrw/dataset/bussgelder-fliessender-verkehr-2024-bn
      # und …-2020-bn (abgerufen 11/2026)
      lizenz: "Creative Commons CC Zero (CC0)"
      hinweis: >-
        Tatorte mit Verstößen an mehr als 250 Tagen eines Jahres gelten als feste Anlagen und
        bleiben draußen (B9 Mainzer Straße, Straßentunnel Bad Godesberg, Reichsstraße,
        Konrad-Adenauer-Damm, Ludwig-Erhard-Allee). Tempolimit und Höhe der Überschreitung nennt
        Bonn nicht; an der Autobahn steht meist nur der Kilometer – solche Kontrollen haben keine
        Lage.
      # Jahresdateien „Bußgelder fließender Verkehr“ (je Verstoß Tag, Uhrzeit, Tatort,
      # Tatbestandsnummer, Bußgeld) und die Messstellen der mobilen Überwachung. Gefunden über
      # GovData (CKAN), das die Bonner Datensätze spiegelt; dazu das Stadtportal (DKAN).
      kataloge:
        - { art: ckan, url: "https://www.govdata.de/ckan/api/3/action/" }
        - { art: dkan, url: "https://opendata.bonn.de/api/1/" }
      alle_kataloge: true
      suche: ["Bußgelder fließender Verkehr", "Messstellen Geschwindigkeitsüberwachung"]
      titel_muster:
        - "(?i)bu(ß|ss)gelder\\s+flie(ß|ss)end"
        - "(?i)messstellen.*geschwindigkeits"
      stadt_muster: "(?i)bonn|-bn\\b"
      formate: ["CSV"]
      ressourcen: "config/bonn_ressourcen.json"
      ordner: "raw/bonn"
    osm:
      label: "Straßennetz und Adressen Bonn (Verortung)"
      url: "https://download.geofabrik.de/europe/germany/nordrhein-westfalen/koeln-regbez-latest.osm.pbf"
      datei: "raw/osm/koeln-regbez-latest.osm.pbf"
      # Bonn: 6 = kreisfreie Stadt, 9 = Stadtbezirke, 10 = Ortsteile
      gebiete_admin_level: ["6", "9", "10"]
      stadtgrenze: { name: "Bonn", admin_level: ["6"] }
      bezirk_ebene: null              # die Bonner Daten nennen keinen Bezirk

  schonungen:
    label: "Schonungen"
    crs_m: "EPSG:25832"            # metrisch (UTM 32N)
    bbox: [10.22, 50.00, 10.44, 50.15]
    start: { lon: 10.3122, lat: 50.0496, zoom: 12.2 }
    kontrollen:
      label: "Geschwindigkeitsmessungen in der Gemeinde Schonungen"
      bereitsteller: "Gemeinde Schonungen"
      kurz: "Gemeinde Schonungen"
      titel: "Verkehrsstatistik – Monatsberichte der kommunalen Verkehrsüberwachung (PDF)"
      herkunft_url: "https://schonungen.de/"
      lizenz_hinweis: "ohne Lizenzangabe"
      hinweis: >-
        Gemessen hat der Zweckverband Kommunale Verkehrsüberwachung Südostbayern. Je Messung
        Messstelle, Tag, Beginn und Ende, Tempolimit, gemessene Fahrzeuge und Verstöße nach
        Klassen (bis/über 20 km/h). Veröffentlicht sind die Monate seit August 2022 und der Mai
        2020, nicht lückenlos.
      # Die Gemeinde stellt die Berichte des Zweckverbands in ihre WordPress-Mediathek
      # (`wp-json/wp/v2/media`); einige Monate nur als Word-Datei.
      kataloge:
        - { art: wordpress, url: "https://schonungen.de/wp-json/wp/v2/media" }
      suche: ["Verkehrsstatistik", "KVUe"]
      titel_muster: "(?i)verkehrsstatistik"
      stadt_muster: "(?i)schonungen"
      formate: ["PDF", "DOCX"]
      ressourcen: "config/schonungen_ressourcen.json"
      ordner: "raw/schonungen"
    osm:
      label: "Straßennetz und Adressen Schonungen (Verortung)"
      url: "https://download.geofabrik.de/europe/germany/bayern/unterfranken-latest.osm.pbf"
      datei: "raw/osm/unterfranken-latest.osm.pbf"
      gebiete_admin_level: ["8", "9", "10"]
      stadtgrenze: { name: "Schonungen", admin_level: ["8"] }
      bezirk_ebene: null              # Gemeindeteile haben in OSM keine Grenzen

  oberderdingen:
    label: "Oberderdingen"
    crs_m: "EPSG:25832"            # metrisch (UTM 32N)
    bbox: [8.70, 49.01, 8.88, 49.12]
    start: { lon: 8.8053, lat: 49.0656, zoom: 12.6 }
    kontrollen:
      label: "Kommunale Geschwindigkeitsmessungen in Oberderdingen"
      bereitsteller: "Stadt Oberderdingen"
      kurz: "Stadt Oberderdingen"
      titel: "Kommunale Geschwindigkeitsmessungen durch das Landratsamt – Quartalstabellen (PDF)"
      herkunft_url: "https://www.oberderdingen.de/"
      lizenz_hinweis: "ohne Lizenzangabe"
      hinweis: >-
        Gemessen hat das Landratsamt Karlsruhe. Je Messung Tag, Messstelle, Tempolimit, gemessene Fahrzeuge und Beanstandungen; Uhrzeit und
        Dauer fehlen. Gefunden sind drei Quartale (1/2024, 4/2025, 1/2026). Zählt das Gerät beide
        Richtungen zusammen (dieselbe Zahl gemessener Fahrzeuge in zwei Zeilen), ist das eine
        Kontrolle. Bei mehrtägigen Messungen steht mitunter an jedem Tag dieselbe Zahl
        (Flehinger Straße 27 im Januar 2026: 3.524, an den angebrochenen Tagen die Hälfte) –
        vermutlich ein Tagesschnitt; der Anteil stimmt dann nur über alle Tage zusammen.
      # Die Tabellen liegen als PDF im CMS der Stadt („resources/ecics_<Nr>.pdf“) ohne
      # Übersichtsseite, die sich abfragen ließe – darum eine feste Liste (gefunden über eine
      # Websuche, Stand 11/2026). Neue Quartale hier eintragen.
      kataloge:
        - art: liste
          url: "https://www.oberderdingen.de/"
          bereitsteller: "Stadt Oberderdingen"
          dateien:
            - { titel: "Geschwindigkeitsmessungen 1. Quartal 2024", url: "https://oberderdingen.de/resources/ecics_3985.pdf" }
            - { titel: "Geschwindigkeitsmessungen 4. Quartal 2025", url: "https://www.oberderdingen.de/resources/ecics_4317.pdf" }
            - { titel: "Geschwindigkeitsmessungen 1. Quartal 2026", url: "https://www.oberderdingen.de/resources/ecics_4342.pdf" }
      titel_muster: "(?i)geschwindigkeitsmessung"
      stadt_muster: "(?i)oberderdingen"
      formate: ["PDF"]
      ressourcen: "config/oberderdingen_ressourcen.json"
      ordner: "raw/oberderdingen"
    osm:
      label: "Straßennetz und Adressen Oberderdingen (Verortung)"
      url: "https://download.geofabrik.de/europe/germany/baden-wuerttemberg/karlsruhe-regbez-latest.osm.pbf"
      datei: "raw/osm/karlsruhe-regbez-latest.osm.pbf"
      gebiete_admin_level: ["8", "9", "10"]
      stadtgrenze: { name: "Oberderdingen", admin_level: ["8"] }
      bezirk_ebene: null              # Flehingen und Großvillars stehen nur im Text

  butzbach:
    label: "Butzbach"
    crs_m: "EPSG:25832"            # metrisch (UTM 32N)
    bbox: [8.50, 50.33, 8.92, 50.52]
    start: { lon: 8.71, lat: 50.43, zoom: 11.0 }
    kontrollen:
      label: "Geschwindigkeitsmessungen im Ordnungsbehördenbezirk Butzbach"
      bereitsteller: "Stadt Butzbach"
      kurz: "Stadt Butzbach"
      titel: >-
        Geschwindigkeitsmessungen – Monatstabellen des gemeinsamen Ordnungsbehördenbezirks
        Butzbach/Münzenberg/Rockenberg/Wölfersheim (PDF)
      herkunft_url: "https://stadt-butzbach.de/themen/geschwindigkeitsmessungen/"
      lizenz_hinweis: "ohne Lizenzangabe"
      hinweis: >-
        Gemessen hat der gemeinsame Ordnungsbehördenbezirk der Städte Butzbach und Münzenberg und
        der Gemeinden Rockenberg und Wölfersheim. Je Messung Tag, Beginn und Ende, gemessene
        Fahrzeuge, Verwarnungen und Bußgelder (zusammen die Überschreitungen); das Tempolimit
        nennen die Tabellen nicht. Veröffentlicht sind die Monate seit Januar 2015, nicht
        lückenlos. Die Messstelle steht als Ortsteil und Straße, oft ohne Hausnummer – verortet
        wird nur in diesem Ortsteil und seiner Kommune, sonst bleibt die Kontrolle ohne Lage.
      # Je Monat ein Beitrag mit der Tabelle als PDF (WordPress, `wp-json/wp/v2/posts`); ältere
      # Tabellen ohne Beitrag stehen nur noch in der Mediathek (`…/media`), oft mit dem Titel
      # „hier“ – darum auch `datei_muster`. Die Dateinamen („sb_oa-messung-1502-1.pdf“ enthält
      # den Februar 2020) sagen nichts über den Monat; es gilt das Datum in der Tabelle.
      kataloge:
        - { art: wordpress, url: "https://stadt-butzbach.de/wp-json/wp/v2/posts" }
        - { art: wordpress, url: "https://stadt-butzbach.de/wp-json/wp/v2/media" }
      alle_kataloge: true
      suche: ["Geschwindigkeitsmessungen", "messung"]
      titel_muster: "(?i)^geschwindigkeitsmessungen im"
      datei_muster: "(?i)/(?:sb_oa-messung|geschwindigkeitsmessungen)[^/]*\\.pdf$"
      stadt_muster: "(?i)butzbach"
      formate: ["PDF"]
      ressourcen: "config/butzbach_ressourcen.json"
      ordner: "raw/butzbach"
    osm:
      label: "Straßennetz und Adressen Butzbach, Münzenberg, Rockenberg, Wölfersheim (Verortung)"
      url: "https://download.geofabrik.de/europe/germany/hessen-latest.osm.pbf"
      datei: "raw/osm/hessen-latest.osm.pbf"
      gebiete_admin_level: ["8", "9", "10", "11"]
      # die vier Kommunen des Ordnungsbehördenbezirks zusammen
      stadtgrenze: { name: ["Butzbach", "Münzenberg", "Rockenberg", "Wölfersheim"], admin_level: ["8"] }
      # Stadt- und Ortsteile: Butzbach und Münzenberg auf 9, Rockenberg und Wölfersheim auf 10
      bezirk_ebene: ["9", "10"]
      # nur im genannten Ortsteil, dann in seiner Kommune – nicht in den Nachbardörfern, die oft
      # gleichnamige Straßen haben (Rosenstraße in Oppershofen und Steinfurth); nennt die Tabelle
      # nur die Kommune, zuerst ihr Kernort
      bezirk_streng: true

  weiterstadt:
    label: "Weiterstadt"
    crs_m: "EPSG:25832"            # metrisch (UTM 32N)
    bbox: [8.50, 49.86, 8.68, 49.98]
    start: { lon: 8.595, lat: 49.917, zoom: 12.3 }
    kontrollen:
      label: "Mobile Geschwindigkeitskontrollen in Weiterstadt"
      bereitsteller: "Stadt Weiterstadt"
      kurz: "Stadt Weiterstadt"
      titel: "Geschwindigkeitskontrollen – Monatstabellen der Kommunalen Bußgeldstelle (PDF)"
      herkunft_url: "https://www.weiterstadt.de/wirtschaft-umwelt-verkehr/umwelt-verkehr/geschwindigkeitsmessungen/index.php"
      lizenz_hinweis: "ohne Lizenzangabe"
      hinweis: >-
        Gemessen hat die Kommunale Bußgeldstelle der Stadt, mobil – die festen Anlagen stehen
        nicht in den Tabellen. Je Messung Tag, Ort mit Fahrtrichtung, Tempolimit, durchfahrene
        Fahrzeuge und davon zu schnelle; Uhrzeit und Dauer fehlen. Veröffentlicht sind die Monate
        seit Januar 2025.
      # Die Monatstabellen („Statistik_GemOBB_<Monat>_<Jahr>.pdf“) liegen in verschiedenen
      # Ordnern des CMS; verlinkt sind alle auf einer Seite (`art: seite`, Linktext = Monat).
      kataloge:
        - art: seite
          url: "https://www.weiterstadt.de/wirtschaft-umwelt-verkehr/umwelt-verkehr/geschwindigkeitsmessungen/index.php"
          dateien: "(?i)/Statistik_GemOBB_[^/]*\\.pdf"
          titel: "Geschwindigkeitskontrollen"
          bereitsteller: "Stadt Weiterstadt"
      titel_muster: "(?i)^geschwindigkeitskontrollen"
      stadt_muster: "(?i)weiterstadt"
      formate: ["PDF"]
      ressourcen: "config/weiterstadt_ressourcen.json"
      ordner: "raw/weiterstadt"
    osm:
      label: "Straßennetz und Adressen Weiterstadt (Verortung)"
      url: "https://download.geofabrik.de/europe/germany/hessen-latest.osm.pbf"
      datei: "raw/osm/hessen-latest.osm.pbf"
      gebiete_admin_level: ["8", "9", "10", "11"]
      stadtgrenze: { name: "Weiterstadt", admin_level: ["8"] }
      bezirk_ebene: null              # die Tabellen nennen keinen Stadtteil

osm:
  bereitsteller: "© OpenStreetMap-Mitwirkende"
  lizenz: "ODbL"
  lizenz_url: "https://opendatacommons.org/licenses/odbl/"
  herkunft_url: "https://download.geofabrik.de/"

karte:
  hintergrund: "OpenFreeMap (Positron), © OpenMapTiles, © OpenStreetMap-Mitwirkende"
  suche: "Photon (Komoot), © OpenStreetMap-Mitwirkende"

# --- Datenlage ------------------------------------------------------------------------------
# Was es außerhalb der Karte gibt – je Stadt ein Punkt mit Stand und Belegen (Recherche
# November 2026, unvollständig). Einträge mit `stadt:` liegen in der Karte; ihr Punkt kommt aus
# den Messstellen. Stand: in_karte | offen | geliefert | kandidat | teilweise | abgelehnt (Texte:
# STAND in src/kontrollen/site.py). Rechtliche Aussagen nur mit Beleg; Kontakte nur über die
# Behördensuche von FragDenStaat (`kontakt.fds_suche`), keine Namen. Neue Hinweise über das
# Issue-Formular „Daten melden“. Ausgabe: data/karte/datenlage.json und docs/DATENLAGE.md.

# Rechtslage je Land (kurz; keine Rechtsberatung). Belege: Stuttgart (§ 4 Abs. 1 Nr. 2 LIFG)
# und München (Satzung, übertragener Wirkungskreis) in den Anfragen unten; Rostock (§ 10 Abs. 1
# IFG M-V, Schriftform); Sachsen: revosax.sachsen.de/vorschrift_gesamt/19699 (§ 1 Abs. 1, § 4
# Abs. 1 und 2); HE, NI, BB wie in vizsim-lab/zaehlkarte.
recht:
  BB: Akteneinsichts- und Informationszugangsgesetz (AIG)
  BE: Berliner Informationsfreiheitsgesetz (IFG)
  BW: Landesinformationsfreiheitsgesetz (LIFG) – gilt auch für Städte und Landratsämter
  BY: kein Landes-IFG – nur städtische Informationsfreiheitssatzungen, die die Verkehrsüberwachung (übertragener Wirkungskreis) oft nicht erfassen
  HE: Hessisches Datenschutz- und Informationsfreiheitsgesetz (HDSIG) – für Kommunen nur, wenn sie es per Satzung einführen
  HH: Hamburgisches Transparenzgesetz
  MV: Informationsfreiheitsgesetz M-V – der Antrag muss schriftlich kommen (Brief oder Fax)
  NI: kein Landes-IFG
  NW: Informationsfreiheitsgesetz NRW
  SN: Sächsisches Transparenzgesetz – gegenüber Landesstellen wie den Polizeidirektionen für jede Person; für Kommunen nur, wenn sie sich per Satzung verpflichten

# Vorlage für Anfragen (Text für das Feld „Anfrage“ auf FragDenStaat – Anrede, Rechtsgrundlage
# und Gebührenhinweis ergänzt FragDenStaat). {stelle}, {seit} und {zusatz} kommen aus dem
# Eintrag (`stelle`, Vorgabe „die Stadt <Kommune>“; `seit`, Vorgabe „dem 1. Januar 2019“).
anfrage_vorlage:
  betreff: Geschwindigkeitskontrollen – Ort, Zeit und Ergebnis je Kontrolle
  text: |-
    Bitte übermitteln Sie mir eine Aufstellung aller Geschwindigkeitskontrollen (mobil und teilstationär), die {stelle} seit {seit} durchgeführt hat. Je Kontrolle bitte:

    1. den Ort: Straße mit Hausnummer oder den Querstraßen, Fahrtrichtung,
    2. Datum, Beginn und Ende der Messung,
    3. die zulässige Höchstgeschwindigkeit,
    4. die Zahl der gemessenen Fahrzeuge und der Überschreitungen (wenn vorhanden nach Stufen der Überschreitung) sowie die Zahl der Fahrverbote.

    Es geht nur um abgeschlossene Kontrollen, nicht um künftige Messorte. Personenbezogene Daten (Kennzeichen, Namen) brauche ich nicht.

    Bitte schicken Sie die Daten in dem maschinenlesbaren Format, in dem sie bei Ihnen vorliegen (z. B. CSV, XLSX oder Export der Messsoftware); eine Aufbereitung ist nicht nötig.
    {zusatz}
    Bitte nennen Sie mir außerdem, unter welchen Bedingungen ich die Daten weiterverwenden und veröffentlichen darf – am liebsten unter einer offenen Lizenz wie der Datenlizenz Deutschland – Namensnennung 2.0.

