# Die EINE Quellenliste des Projekts. Speist `kontrollen fetch|build|osm|site` und
# pipeline/data/karte/manifest.json, aus dem die Karte ihre Quellenangaben und Lizenzhinweise
# baut – nie im Frontend nachtragen.
#
# Pfade: `datei` relativ zu pipeline/data/ (gitignored Rohdaten).

staedte:
  berlin:
    label: "Berlin"
    crs_m: "EPSG:25833"            # metrisch (UTM 33N), Ausgabe immer EPSG:4326
    bbox: [13.08, 52.33, 13.77, 52.68]
    start: { lon: 13.40, lat: 52.51, zoom: 10.6 }
    kontrollen:
      label: "Temporäre Geschwindigkeitskontrollen 2017 bis August 2020"
      bereitsteller: "Polizei Berlin"
      kurz: "Polizei Berlin"
      titel: "Auszug aus der Geschwindigkeitsdatenbank (IFG-Bescheid vom 09.12.2020, Anlagen 1–4)"
      herkunft_url: "https://fragdenstaat.de/anfrage/geschwindigkeitskontrollen-von-kfz-in-berlin/"
      lizenz: null                  # der Bescheid nennt keine Lizenz
      lizenz_hinweis: "Amtliche Auskunft nach IFG, ohne Lizenzangabe"
      # Die Polizei hat je Zeitraum ein PDF geliefert (gedruckte Tabelle, eine Zeile je
      # Kontrolle); `berlin_pdf.py` liest es Zeichen für Zeichen. Gegenprobe: Anlage 3 ergibt
      # alle 9.150 Zeilen von 2019 der früheren CSV (vizsim/geschwindigkeitskontrollen, v01) –
      # bis auf deren Lesefehler („50/30“ als Tempo 0, „-“ als 0, abgeschnittene Zellen).
      anlagen:
        - jahr: 2017
          titel: "Anlage 1 (2017)"
          url: "https://media.frag-den-staat.de/files/foi/546222/202012094IFG102.20Anlage1GeschwindigkeitskontrollenBerlin2017.pdf"
          sha256: "79d01ca129ca4718efa81222cae8022a6535ad347fa0ac3eb3ff2f5f5d558780"
          datei: "raw/berlin/anlage1_2017.pdf"
        - jahr: 2018
          titel: "Anlage 2 (2018)"
          url: "https://media.frag-den-staat.de/files/foi/546222/202012095IFG102.20Anlage2GeschwindigkeitskontrollenBerlin2018.pdf"
          sha256: "0c05f54626e9b62ecbfbdf29012f712c6377371a5419133f8e4c19104eca97d2"
          datei: "raw/berlin/anlage2_2018.pdf"
        - jahr: 2019
          titel: "Anlage 3 (2019)"
          url: "https://media.frag-den-staat.de/files/foi/546222/202012096IFG102.20Anlage3GeschwindigkeitskontrollenBerlin2019.pdf"
          sha256: "93ff55540cd6bd713c6b2d9fbdf6b459b9752870cbb7b074013559bef243829a"
          datei: "raw/berlin/anlage3_2019.pdf"
        - jahr: 2020
          titel: "Anlage 4 (01.01.–31.08.2020, Stand 05.10.2020)"
          url: "https://media.frag-den-staat.de/files/foi/546222/202012097IFG102.20Anlage4GeschwindigkeitskontrollenBerlinbis31.08.2020.pdf"
          sha256: "f8ce5b590f5500bb968afd9269984fa51dce2826f7602457a6e0eeca1342a270"
          datei: "raw/berlin/anlage4_2020.pdf"
    osm:
      label: "Straßennetz und Adressen Berlin (Verortung)"
      url: "https://download.geofabrik.de/europe/germany/berlin-latest.osm.pbf"
      datei: "raw/osm/berlin-latest.osm.pbf"
      # Verwaltungsgrenzen in OSM: 4 = Land Berlin, 9 = Bezirke, 10 = Ortsteile
      gebiete_admin_level: ["4", "9", "10"]
      stadtgrenze: { name: "Berlin", admin_level: ["4"] }
      bezirk_ebene: "9"               # „Verwaltungsbezirk“ der Kontrollen grenzt die Suche ein

  aachen:
    label: "Aachen"
    crs_m: "EPSG:25832"            # metrisch (UTM 32N)
    bbox: [5.97, 50.63, 6.22, 50.86]
    start: { lon: 6.09, lat: 50.77, zoom: 11.6 }
    kontrollen:
      label: "Geschwindigkeitskontrollen der Stadt Aachen"
      bereitsteller: "Stadt Aachen"
      kurz: "Stadt Aachen"
      titel: "Geschwindigkeitskontrollen (Open Data, Monatsdateien)"
      herkunft_url: "https://offenedaten.aachen.de/"
      # CKAN-Kataloge, der Reihe nach probiert. Gefunden werden alle Datensätze, deren Titel
      # zum Muster passt; jede Excel-/CSV-Ressource ist eine Monatsdatei. Was gefunden wurde,
      # schreibt `fetch --aachen --neu` nach config/aachen_ressourcen.json (mit Prüfsummen) –
      # ohne --neu lädt `fetch` genau diese Liste.
      ckan:
        - "https://offenedaten.aachen.de/api/3/action/"
        - "https://ckan.open.nrw.de/api/3/action/"
      suche: "Geschwindigkeitskontrollen"
      titel_muster: "(?i)geschwindigkeitskontroll"
      stadt_muster: "(?i)aachen"
      formate: ["XLSX", "XLS", "CSV"]
      ressourcen: "config/aachen_ressourcen.json"
      ordner: "raw/aachen"
      # Das Portal hält je Jahr nur die letzten drei Monate. Den Juni 2020 der alten Karte gibt
      # es dort nicht mehr – er steckt vollständig in deren HTML (Tooltips), auf einen Commit
      # festgelegt.
      alt:
        label: "Juni 2020 (aus der alten Karte, Datei nicht mehr im Portal)"
        url: "https://raw.githubusercontent.com/vizsim/geschwindigkeitskontrollen/47f921e01ec9aafcf9895c3b696de825a315f577/geschw_aachen_juni2020.html"
        sha256: "5796c29593b8d6af817be57dffbadf2a39373951c12c0829ceb32e980f5d5967"
        datei: "raw/aachen_alt/geschw_aachen_juni2020.html"
    osm:
      label: "Straßennetz und Adressen Aachen (Verortung)"
      # Geofabrik hat keinen Stadt-Auszug; der Regierungsbezirk wird auf `bbox` zugeschnitten
      url: "https://download.geofabrik.de/europe/germany/nordrhein-westfalen/koeln-regbez-latest.osm.pbf"
      datei: "raw/osm/koeln-regbez-latest.osm.pbf"
      # Aachen gehört seit 2009 zur StädteRegion; welche Ebene die Stadt in OSM trägt, ist hier
      # egal: genommen wird die kleinste Fläche namens „Aachen“ auf diesen Ebenen.
      gebiete_admin_level: ["6", "7", "8", "9", "10"]
      stadtgrenze: { name: "Aachen", admin_level: ["6", "7", "8"] }
      bezirk_ebene: null              # die Aachener Daten nennen keinen Bezirk

  koeln:
    label: "Köln"
    crs_m: "EPSG:25832"            # metrisch (UTM 32N)
    bbox: [6.76, 50.82, 7.17, 51.09]
    start: { lon: 6.96, lat: 50.94, zoom: 11.2 }
    kontrollen:
      label: "Geschwindigkeitsüberwachung der Stadt Köln"
      bereitsteller: "Stadt Köln"
      kurz: "Stadt Köln"
      titel: "Geschwindigkeitsüberwachung Köln (Open Data, Einzelverstöße und Standorte)"
      herkunft_url: "https://www.offenedaten-koeln.de/"
      # Jahresdatensätze (2017–2022, 2023, 2024, …): je Verstoß eine Zeile, dazu Tabellen der
      # Standorte je Dienststelle. Das Landesportal spiegelt sie nicht vollständig – darum
      # werden beide Kataloge gefragt und die Funde vereinigt (`alle_kataloge`).
      ckan:
        - "https://www.offenedaten-koeln.de/api/3/action/"
        - "https://ckan.open.nrw.de/api/3/action/"
      alle_kataloge: true
      suche: ["Geschwindigkeitsüberwachung Köln"]
      titel_muster: "(?i)geschwindigkeits(ü|ue)berwachung"
      stadt_muster: "(?i)k(ö|oe)ln"
      formate: ["CSV"]
      ressourcen: "config/koeln_ressourcen.json"
      ordner: "raw/koeln"
    osm:
      label: "Straßennetz und Adressen Köln (Verortung)"
      url: "https://download.geofabrik.de/europe/germany/nordrhein-westfalen/koeln-regbez-latest.osm.pbf"
      datei: "raw/osm/koeln-regbez-latest.osm.pbf"
      # Köln: 6 = kreisfreie Stadt, 9 = Stadtbezirke, 10 = Stadtteile
      gebiete_admin_level: ["6", "9", "10"]
      stadtgrenze: { name: "Köln", admin_level: ["6"] }
      bezirk_ebene: "10"              # „Stadtteil“ der Standorte grenzt die Suche ein

  bonn:
    label: "Bonn"
    crs_m: "EPSG:25832"            # metrisch (UTM 32N)
    bbox: [7.01, 50.62, 7.22, 50.78]
    start: { lon: 7.10, lat: 50.71, zoom: 11.8 }
    kontrollen:
      label: "Geschwindigkeitsverstöße der Bundesstadt Bonn"
      bereitsteller: "Bundesstadt Bonn"
      kurz: "Stadt Bonn"
      titel: "Bußgelder fließender Verkehr (Open Data, Einzelverstöße)"
      herkunft_url: "https://opendata.bonn.de/"
      # Jahresdateien „Bußgelder fließender Verkehr“ (je Verstoß Tag, Uhrzeit, Tatort,
      # Tatbestandsnummer, Bußgeld) und die Messstellen der mobilen Überwachung.
      ckan:
        - "https://opendata.bonn.de/api/3/action/"
        - "https://ckan.open.nrw.de/api/3/action/"
      alle_kataloge: true
      suche: ["Bußgelder fließender Verkehr", "Messstellen Geschwindigkeitsüberwachung"]
      titel_muster:
        - "(?i)bu(ß|ss)gelder\\s+flie(ß|ss)end"
        - "(?i)messstellen.*geschwindigkeits"
      stadt_muster: "(?i)bonn|-bn\\b"
      formate: ["CSV"]
      ressourcen: "config/bonn_ressourcen.json"
      ordner: "raw/bonn"
    osm:
      label: "Straßennetz und Adressen Bonn (Verortung)"
      url: "https://download.geofabrik.de/europe/germany/nordrhein-westfalen/koeln-regbez-latest.osm.pbf"
      datei: "raw/osm/koeln-regbez-latest.osm.pbf"
      # Bonn: 6 = kreisfreie Stadt, 9 = Stadtbezirke, 10 = Ortsteile
      gebiete_admin_level: ["6", "9", "10"]
      stadtgrenze: { name: "Bonn", admin_level: ["6"] }
      bezirk_ebene: null              # die Bonner Daten nennen keinen Bezirk

osm:
  bereitsteller: "© OpenStreetMap-Mitwirkende"
  lizenz: "ODbL"
  lizenz_url: "https://opendatacommons.org/licenses/odbl/"
  herkunft_url: "https://download.geofabrik.de/"

karte:
  hintergrund: "OpenFreeMap (Positron), © OpenMapTiles, © OpenStreetMap-Mitwirkende"
  suche: "Photon (Komoot), © OpenStreetMap-Mitwirkende"
