      2020 von Stadt und Polizeidirektion abgelehnt; die Stadt bestätigte rund 6.700 Kontrollen
      2017–2020
    situation: >-
      Die Stadt schrieb, die Kontrollen seien nicht automatisiert abrufbar und der Aufwand
      unverhältnismäßig; ihre Informationsfreiheitssatzung galt nur für Einwohner. Ein
      Landesgesetz gab es damals nicht.
    empfehlung: >-
      Seit dem Sächsischen Transparenzgesetz hat jede Person einen Anspruch gegenüber
      Landesstellen – eine neue Anfrage an die Polizeidirektion Dresden könnte gelingen. Für die
      Stadt gilt es nur, wenn sie sich per Satzung verpflichtet.
