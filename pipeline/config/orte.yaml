# Ortsangaben aus den Kontrolldaten, die so nicht in OSM stehen -> Name in OSM.
#
# Gilt nur für die Suche – die Karte zeigt die Angabe wie geliefert, und jede so verortete
# Kontrolle trägt den Hinweis „Ortsangabe von Hand zugeordnet“. Nur eintragen, was eindeutig
# ist; im Zweifel bleibt eine Kontrolle lieber ungenau (nur Straße) als falsch.
# Schlüssel: die Angabe der Quelle (Groß-/Kleinschreibung und Satzzeichen egal) oder ein Kürzel
# am Anfang der Angabe ("TAG Gerosteig" -> TAG).

berlin:
  TRH: "Tunnel Rudower Höhe"                      # A 113
  TAG: "Tunnel Altglienicke"                      # A 113
  ICC: "Messedamm-Süd"                            # A 100, Anschlussstelle am ICC
  "ICC/Überleitung zur A 115": "Dreieck Funkturm" # Übergang A 100 -> A 115
  "Höhe Eichkampsiedlung": "Eichkampstraße"       # A 115 unter der Eichkampstraße
  "Eichkampsiedlung": "Eichkampstraße"            # dasselbe, 2020 ohne „Höhe“
  "Zollamt Dreilinden": "Stadtgrenze"             # A 115 an der Landesgrenze bei Dreilinden
  "Höhe Zollamt Dreilinden": "Stadtgrenze"        # dasselbe (2020)
  "Siegessäule": "Großer Stern"                   # die Säule steht im Kreisverkehr
  "Brandenburger Tor": "Platz des 18. März"       # westlich des Tors
  "Nachtigalplatz": "Manga-Bell-Platz"            # 2022 umbenannt
  "Tiergartentunnel": "Tunnel Tiergarten Spreebogen"

aachen:
  "Aachen Münchener Allee": "Aachener-und-Münchener-Allee"
  "Aachen Müncher Allee": "Aachener-und-Münchener-Allee"
  "Aachener Münchener Str.": "Aachener-und-Münchener-Allee"

koeln:
  # Abkürzungen in den Standorttabellen der Stadt (vor allem 2017–2022, das Feld ist dort auf
  # 30 Zeichen gekürzt); gesucht wird weiter im genannten Stadtteil
  "Ber.Gl.Str.": "Bergisch Gladbacher Straße"         # Dellbrück
  "Bergisch Gladb.Str.": "Bergisch Gladbacher Straße" # Dellbrück
  "Berg. Gladbacher.": "Bergisch Gladbacher Straße"   # Mülheim
  "Berg.-Gladb.-Str.": "Bergisch Gladbacher Straße"   # Holweide, Buchheim (auch „Berg.-Gladb. Str.“)
  "K.-Aden.-Ufer": "Konrad-Adenauer-Ufer"             # Neustadt-Nord
  "K.Adenauer-Ufer": "Konrad-Adenauer-Ufer"           # dasselbe
  "H.-Erpenbach-Str.": "Heinrich-Erpenbach-Straße"    # Sürth – die einzige Erpenbach-Straße in Köln
  "Ricarda-Huch-tr.": "Ricarda-Huch-Straße"           # Stammheim, Tippfehler („tr.“ statt „Str.“)
  "Lib.Landstr.": "Liburer Landstraße"                # Libur

schonungen:
  # Abkürzungen in den Monatsberichten; gesucht wird in der ganzen Gemeinde (die Gemeindeteile
  # haben in OSM keine Grenzen) – beide Straßen gibt es dort nur einmal
  "Marktst. Hauptstr.": "Marktsteinacher Hauptstraße"      # Marktsteinach, St 2266
  "Marktstein. Hauptstraße": "Marktsteinacher Hauptstraße" # dasselbe (auch „Marktstein. Hauptstr.“)
  "Marktst. Straße": "Marktsteinacher Straße"              # Waldsachsen, SW 24

butzbach:
  # Tippfehler in den Monatstabellen; gesucht wird weiter im genannten Orts- oder Stadtteil
  "J.-F.-Kennedey-Str.": "John-F.-Kennedy-Straße"  # Kernstadt, die einzige Kennedy-Straße dort
  # Ebersgöns: Zahlendreher – eine K 636 gibt es dort nicht, die K 363 (so auch an anderer Stelle
  # der Tabellen) kreuzt in Ebersgöns „Zum Weißen Stein“ („Ebersgöns, K636 - Ecke Zum Weißen Stein“)
  "K 636": "K 363"
  # Nieder-Weisel, am Kinderheim („Hausener Str. / Kinderheim“, ebenso „Am Waldhof / Kinderheim“):
  # die befahrbare Straße dort heißt in OSM „Hausener Weg“; die Hausener Straße in Hoch-Weisel
  # liegt gut 2 km entfernt
  "Hausener Str.": "Hausener Weg"

weiterstadt:
  # Abkürzungen und Beschreibungen in den Monatstabellen; Weiterstadt hat nur eine Rudolf-Diesel-
  # und eine Darmstädter Landstraße
  "R.-Diesel-Straße": "Rudolf-Diesel-Straße"       # auch „R.-Diesel-Str.“
  "Darmst.- Landstraße": "Darmstädter Landstraße"
  # die B 42 und die L 3113 kreuzen in Weiterstadt nur die A 5 (Anschlussstelle Weiterstadt, an der
  # B 42; die A 67 bleibt über 1 km entfernt) – „SO“, „NW“, „SW“ nennen das Viertel der Anschlussstelle
  "BAB": "A 5"                                     # „BAB Anschlußstelle NW“ usw.
  "BAB5 Anschlußstelle NW": "A 5"
  "BAB5 Anschlußstelle SO": "A 5"
  "BAB5 Anschlussstelle SW": "A 5"
  "Autobahnbrücke": "A 5"                          # „L3113 Höhe Autobahnbrücke“
  # die Justizvollzugsanstalt liegt an der Straße Vor den Löserbecken („Höhe Vor den Löserbecken JVA“)
  "JVA": "Vor den Löserbecken"
